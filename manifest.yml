# =============================================================================
# manifest.yml
# =============================================================================
# Propósito: decirle a Cloud Foundry cómo desplegar y correr la aplicación.
#
# Cómo usarlo:
#   cf push
#   (CF busca manifest.yml en la carpeta actual automáticamente)
#
# SEGURIDAD:
#   Este archivo NO contiene credenciales ni referencias a secretos.
#   Es seguro para Git.
#
#   Credenciales de HANA:
#     Se inyectan automáticamente via VCAP_SERVICES gracias al
#     service binding declarado en la sección "services:" abajo.
#     config.py detecta VCAP_SERVICES y lee las credenciales de ahí.
#
#   Credenciales externas (API, token de seguridad):
#     Se configuran DESPUÉS del push con cf set-env:
#
#       cf set-env sap-ai-soc BEARER_TOKEN     "token-del-equipo"
#       cf set-env sap-ai-soc API_BASE_URL     "url-de-la-api"
#       cf set-env sap-ai-soc JOB_SECRET_TOKEN "uuid-aleatorio"
#       cf restage sap-ai-soc
#
#   NUNCA agregar sección env: con valores de credenciales aquí.
# =============================================================================

applications:
  - name: sap-ai-soc-papoi
    # Nombre de la aplicación en Cloud Foundry.
    # Debe ser único en tu organización.

    memory: 2048M
    # RAM asignada al proceso.
    # 512MB es suficiente para el pipeline con pandas.
    # Si el modelo ML es pesado, aumentar.

    disk_quota: 2G
    # Espacio en disco para CSVs temporales.
    # Los datos permanentes van a HANA.

    instances: 1
    # Número de instancias del proceso.
    # DEBE ser 1 — múltiples instancias harían ingesta duplicada
    # y romperían la deduplicación en memoria.

    buildpacks:
      - python_buildpack
    # CF detecta que es Python e instala requirements.txt.

    command: python pipeline_loop.py
    # Entry point de la aplicación.
    # pipeline_loop.py corre el polling cada 1-2 minutos.
    # Es el mismo comando que usas localmente.

    health-check-type: process
    # CF verifica que el proceso Python sigue corriendo.
    # "process" porque pipeline_loop.py es un loop, no un servidor HTTP.

    services:
      - sap-soc-hana
      # Instancia de SAP HANA Cloud.
      # Este nombre DEBE coincidir exactamente con la salida de: cf services
      # El binding inyecta VCAP_SERVICES con host, port, user, password.

      - pyuaa
      # Instancia de XSUAA (Authorization and Trust Management).
      # Necesaria para autenticación de servicios en BTP.