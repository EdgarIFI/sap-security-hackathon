applications:
- name: sap-ai-soc-mobile
  memory: 512M
  buildpacks:
    - python_buildpack
  path: .
  command: streamlit run dashboard/app_mobile.py --server.port $PORT --server.address 0.0.0.0 --server.headless true
  health-check-type: process
  instances: 1
  env:
    OPENAI_API_KEY: ""
    HANA_HOST: ""
    HANA_USER: "DBADMIN"
    HANA_PASSWORD: ""
    HANA_PORT: "443"